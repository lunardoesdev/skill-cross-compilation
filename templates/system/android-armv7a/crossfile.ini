# Meson cross-file — Android armeabi-v7a (armv7a), any API level.
# Source snippets/systems/android-armv7a.sh first. Note cpu_family=arm, cpu=armv7.
#
# Usage:
#   . snippets/systems/android-armv7a.sh
#   meson setup build --cross-file templates/system/android-armv7a/crossfile.ini --prefix "$PREFIX"

[binaries]
# Compilers/binutils come from the environment (full paths into the NDK, kept off PATH).
pkgconfig = 'pkg-config'

[host_machine]
system = 'android'
# CPU family is "arm"; the detail is in cpu
cpu_family = 'arm'
cpu = 'armv7'
endian = 'little'

[properties]
# everything else comes from our flags
