# Meson cross-file — Android x86-64 (x86_64), any API level.
# Source snippets/systems/android-x86_64.sh first.
#
# Usage:
#   . snippets/systems/android-x86_64.sh
#   meson setup build --cross-file templates/system/android-x86_64/crossfile.ini --prefix "$PREFIX"

[binaries]
# Compilers/binutils come from the environment (full paths into the NDK, kept off PATH).
pkgconfig = 'pkg-config'

[host_machine]
system = 'android'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

[properties]
# everything else comes from our flags
