# Meson cross-file — Android x86 (i686), any API level.
# Source snippets/systems/android-i686.sh first. cpu_family=x86, cpu=i686.
#
# Usage:
#   . snippets/systems/android-i686.sh
#   meson setup build --cross-file templates/system/android-i686/crossfile.ini --prefix "$PREFIX"

[binaries]
# Compilers/binutils come from the environment (full paths into the NDK, kept off PATH).
pkgconfig = 'pkg-config'

[host_machine]
system = 'android'
# CPU family "x86"; the precise cpu is i686
cpu_family = 'x86'
cpu = 'i686'
endian = 'little'

[properties]
# everything else comes from our flags
