# Meson cross-file — Windows x86 via mingw-w64 (i686-w64-mingw32).
# Source snippets/systems/mingw32.sh first.
#
# Usage:
#   . snippets/systems/mingw32.sh
#   meson setup build --cross-file templates/system/mingw32/crossfile.ini --prefix "$PREFIX"

[binaries]
c = 'i686-w64-mingw32-gcc'
cpp = 'i686-w64-mingw32-g++'
ar = 'i686-w64-mingw32-ar'
strip = 'i686-w64-mingw32-strip'
windres = 'i686-w64-mingw32-windres'
pkgconfig = 'pkg-config'

[host_machine]
system = 'windows'
# CPU family "x86"; the precise cpu is i686
cpu_family = 'x86'
cpu = 'i686'
endian = 'little'

[properties]
exe_suffix = 'exe'
# everything else comes from our flags
