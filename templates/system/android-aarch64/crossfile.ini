# Meson cross-file — Android aarch64 (arm64-v8a), any API level.
# Portable: no retrolunar-specific keys. Compilers and binutils come from the
# environment, so source snippets/systems/android-aarch64.sh first.
#
# Usage:
#   . snippets/systems/android-aarch64.sh
#   meson setup build --cross-file templates/system/android-aarch64/crossfile.ini \
#     --prefix "$PREFIX"
#
# Reference: references/systems/android-aarch64.md

[binaries]
# Compilers and binutils come from the environment: the system exports $CC, $CXX, $AR,
# $STRIP and $LD as full paths into the NDK, and the cross toolchain is deliberately
# kept off PATH, so bare names cannot resolve. Host pkg-config with the right env vars
# works fine.
pkgconfig = 'pkg-config'

[host_machine]
# meson's name for the target OS
system = 'android'
# CPU architecture
cpu_family = 'aarch64'
cpu = 'aarch64'
# byte order / endianness
endian = 'little'

[properties]
# everything else comes from our flags, nothing more needed
