# Meson cross-file — Windows x86-64 via mingw-w64 (x86_64-w64-mingw32).
# Source snippets/systems/mingw64.sh first.
#
# Usage:
#   . snippets/systems/mingw64.sh
#   meson setup build --cross-file templates/system/mingw64/crossfile.ini --prefix "$PREFIX"

[binaries]
# C compiler
c = 'x86_64-w64-mingw32-gcc'
# C++ compiler
cpp = 'x86_64-w64-mingw32-g++'
# binutils
ar = 'x86_64-w64-mingw32-ar'
strip = 'x86_64-w64-mingw32-strip'
# resource compiler for .rc files
windres = 'x86_64-w64-mingw32-windres'
# host pkg-config with the right env vars works fine
pkgconfig = 'pkg-config'

[host_machine]
# meson's name for the target OS
system = 'windows'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

[properties]
# exe suffix so meson names test programs correctly
exe_suffix = 'exe'
# everything else comes from our flags
